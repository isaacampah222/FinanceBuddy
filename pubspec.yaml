name: finance_buddy
description: A private personal finance tracker with custom accounts and transaction suggestions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  path: ^1.9.1
  crypto: ^3.0.6
  permission_handler: ^12.0.3
  flutter_sms_inbox: ^1.0.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
